services:
  container1:
    build:
      context: .
      dockerfile: Dockerfile  # Use your Dockerfile to build the image
    container_name: program
    command: ["bash"]  # Start bash on container startup
    networks:
      - my_network
    stdin_open: true   # Allow interactive mode
    tty: true          # Allocate a pseudo-TTY

  container2:
    build:
      context: .
      dockerfile: Dockerfile  # Use your Dockerfile to build the image
    container_name: tcp
    command: ["bash"]  # Start bash on container startup
    networks:
      - my_network
    stdin_open: true   # Allow interactive mode
    tty: true          # Allocate a pseudo-TTY

networks:
  my_network:
    driver: bridge
